name: automated release

on:
  push:
    branches:
      - main # triggers when new commit(s) get pushed or merged to main
    paths:
      - "package.json" # only start if package.json included in the commit(s) to avoid wasting resource usage

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: checkout source code
        uses: actions/checkout@v4
      
      - name: setup bun environment
        uses: oven-sh/setup-bun@v2
      
      - name: install dependencies
        run: bun install
      
      - name: compile global cdn bundle
        run: bun run ./cdn_build/build_cdn.js
      
      - name: get version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
      
      - name: create and upload github release assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./cdn_build/dist/kumiyui.js, ./cdn_build/dist/kumiyui.min.js"
          tag: ${{ steps.package_version.outputs.version }}
          name: "Release ${{ steps.package_version.outputs.version }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}